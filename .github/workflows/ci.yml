name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python runtime dependencies
        run: python -m pip install -r skills/blender2easy/scripts/requirements.txt
      - name: Run unit and frontend tests
        run: python scripts/check.py --require-node

  mcp-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional MCP SDK and runtime dependencies
        run: python -m pip install -r skills/blender2easy/scripts/requirements-mcp.txt
      - name: Run Python and official MCP integration tests
        run: python scripts/check.py --python-only --with-mcp
