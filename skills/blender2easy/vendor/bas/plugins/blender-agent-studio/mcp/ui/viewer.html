<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);font-size:13px;color:var(--color-text-primary,light-dark(#202421,#ecedeb));background:var(--color-background-primary,light-dark(#fff,#202220))}*{box-sizing:border-box}body{margin:0;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{font-size:14px;font-weight:600;margin:0}.muted{color:var(--color-text-secondary,light-dark(#626860,#abb2a9));font-size:12px}button,select{font:inherit;color:inherit;background:transparent;border:1px solid light-dark(#d8ddd6,#50554e);border-radius:6px;padding:6px 10px}button{cursor:pointer}button:hover{background:light-dark(#eef1ed,#343a32)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #669167;outline-offset:3px}button[aria-pressed=true]{background:light-dark(#e3ebe0,#374634)}.stage{height:clamp(220px,56vw,440px);overflow:auto;border-radius:8px;background:light-dark(#f2f3f0,#171917);display:flex;align-items:center;justify-content:center}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.stage.zoom{display:block}.stage.zoom img{max-width:none;max-height:none}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}select{min-width:0;max-width:70%;flex:1}#caption{flex:1}details{margin-top:12px;border-top:1px solid light-dark(#e3e6e0,#3d423b);padding-top:10px}summary{cursor:pointer;width:fit-content;font-size:12px}.detail-grid{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;margin:12px 0 0}.detail-grid dt{color:var(--color-text-secondary,light-dark(#626860,#abb2a9))}.detail-grid dd{margin:0;overflow-wrap:anywhere}#notice{margin:10px 0 0}.empty{padding:25px;text-align:center;max-width:320px} [hidden]{display:none!important}@media(max-width:360px){body{padding:10px}header{align-items:flex-start}h1{max-width:65%}.stage{height:240px}}
</style></head><body><header><h1 id="title">Blender preview</h1><span id="status" class="muted" role="status">Preparing…</span></header><div id="stage" class="stage"><p id="empty" class="empty muted">Your render will appear here.</p><img id="image" alt="" hidden></div><div id="controls" class="controls" hidden><select id="views" aria-label="Render view"></select><span id="caption" class="muted"></span><button id="zoom" type="button" aria-pressed="false">100%</button></div><p id="notice" class="muted" hidden></p><details id="details" hidden><summary>Render details</summary><dl id="facts" class="detail-grid"></dl></details><script type="module">/*VIEWER_SCRIPT*/</script></body></html>
